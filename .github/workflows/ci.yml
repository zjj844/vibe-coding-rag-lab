name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-tests:
    name: 确定性测试（不花钱、必须绿）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install pytest
      - name: 跑测试（含检索质量门槛）
        run: python -m pytest -v

  evals:
    name: 质量评估（出报告，不卡 CI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install pytest
      - name: 跑评估（不依赖任何 API Key）
        run: python evals/run_eval.py --md
        continue-on-error: true
      - name: 上传评估产物
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: evals/artifacts/
      - name: 展示评估摘要
        run: cat EVAL.md
